name: Approve reviewed visual baselines
on:
  push:
    branches:
      - redesign/network-identity-20261001
    paths:
      - .github/workflows/approve-reviewed-baselines.yml

permissions:
  contents: write

jobs:
  approve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Regenerate reviewed baselines
        run: npx playwright test -c playwright.visual.config.js --update-snapshots=all
      - name: Commit reviewed baselines
        run: |
          git config user.name "Prof. Adeeb Noor"
          git config user.email "adeebnoor@users.noreply.github.com"
          git add e2e/visual-baselines
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "Approve reviewed network identity baselines"
          git push origin HEAD:${GITHUB_REF_NAME}
