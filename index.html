        </section>
        <section data-kamin-lang="en" hidden dir="ltr"><h1>Kamin — Capability Trust Layer</h1><p>Kamin turns academic records and projects into a capability profile the user owns, then explains fit, gaps, and next steps. JavaScript is required for the interactive application. You can read the <a href="/en/guide.html">user guide</a>, <a href="/en/catalog.html">sourced catalog</a>, and <a href="/en/sample-report.html">sample report</a> without it.</p></section>
