services:
  - type: web
    runtime: static
    name: kamin
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /ocr/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /knowledge/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /mapping/*
        name: Cache-Control
        value: public, max-age=86400, must-revalidate
      - path: /kamin-logo-v3.webp
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /icon-192.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /icon-512.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /apple-touch-icon.png
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /og-kamin-1200x630.jpg
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /favicon.ico
        name: Cache-Control
        value: public, max-age=604800
      - path: /favicon.svg
        name: Cache-Control
        value: public, max-age=604800
      - path: /static-i18n.js
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /manifest.json
        name: Content-Type
        value: application/manifest+json; charset=utf-8
      - path: /manifest.json
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json; charset=utf-8
      - path: /manifest.webmanifest
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
